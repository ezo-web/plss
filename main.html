<html>
  <title>PLSS - STARTUP</title>

  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        color-scheme: dark;
        --canvas-bg-color: rgba(0, 0, 0, 0); /* transparent */
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #canvas {
        border: #525252;
        border-style: dashed;
        border-width: 5;
        outline: none; /* because of the 'tabindex' focus trick */
        background-color: var(--canvas-bg-color);
        animation: revealEffect 1s ease-in forwards;
        opacity: 0;
        visibility: hidden;
      }

      @keyframes revealEffect {
        to {
          opacity: 1;
          visibility: visible;
        }
      }
    </style>
  </head>

  <body>
    <!-- 'tabindex' is a trick to make the canvas capture key events -->
    <canvas id="canvas" tabindex="1"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.17"></script>
    <script src="life2d.js"></script>
  </body>
</html>
