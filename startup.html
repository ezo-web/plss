<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="5; url=main.html" />
    <title>PLSS - STARTING UP</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div
      class="flex flex-col items-center justify-center min-h-screen text-white"
    >
      <h1 class="text-4xl font-bold fade-in-out">Starting Up...</h1>
      <br />
      <script>
        setTimeout(async () => {
          try {
            await fetch("/startup", {
              method: "POST",
            });
          } catch (err) {
            console.error(err);
          }
        }, 5000);
      </script>

      <div class="spinner" role="status"></div>
    </div>
  </body>
</html>
